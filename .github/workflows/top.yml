name: Top 10 par famille
on:
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi, 4 h 17 heure de Paris (hiver)
  workflow_dispatch:
    inputs:
      only:
        description: "Familles à recalculer (ids séparés par des virgules ; vide = toutes)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: top
  cancel-in-progress: false
jobs:
  top:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/top.js
        env:
          ONLY: ${{ github.event.inputs.only }}
      - name: Publier top.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top.json
          git diff --cached --quiet && exit 0
          git commit -m "Top 10 : mise à jour automatique du $(date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
